<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Background Remover | Cozyleaf.in</title>
<style>
  * { box-sizing: border-box; }
  body {
    font-family: -apple-system, Segoe UI, Roboto, sans-serif;
    background: #f4f1ea;
    margin: 0;
    padding: 20px;
    color: #1a1a1a;
  }
  .wrap { max-width: 520px; margin: 0 auto; }
  h1 { font-size: 22px; margin-bottom: 4px; }
  .sub { color: #666; font-size: 14px; margin-bottom: 20px; }

  .drop {
    border: 2px dashed #ccc;
    border-radius: 14px;
    padding: 30px 16px;
    text-align: center;
    background: #fff;
    cursor: pointer;
  }
  .drop input { display: none; }
  .drop-btn {
    display: inline-block;
    background: #e8541e;
    color: #fff;
    padding: 12px 28px;
    border-radius: 30px;
    font-weight: 600;
    margin-top: 10px;
  }
  .hint { font-size: 13px; color: #888; margin-top: 8px; }

  .status-box {
    margin-top: 16px;
    padding: 12px 14px;
    border-radius: 10px;
    font-size: 14px;
    display: none;
  }
  .status-box.show { display: block; }
  .status-info { background: #eaf2ff; color: #1a4d8f; }
  .status-success { background: #e6f7ee; color: #1a7a4c; }
  .status-error { background: #fdecea; color: #a33; }

  .progress-track {
    width: 100%;
    height: 8px;
    background: #eee;
    border-radius: 6px;
    overflow: hidden;
    margin-top: 10px;
    display: none;
  }
  .progress-track.show { display: block; }
  .progress-fill {
    height: 100%;
    width: 0%;
    background: #e8541e;
    transition: width 0.2s;
  }

  .preview {
    margin-top: 20px;
    border-radius: 14px;
    overflow: hidden;
    background:
      linear-gradient(45deg, #ddd 25%, transparent 25%),
      linear-gradient(-45deg, #ddd 25%, transparent 25%),
      linear-gradient(45deg, transparent 75%, #ddd 75%),
      linear-gradient(-45deg, transparent 75%, #ddd 75%);
    background-size: 20px 20px;
    background-position: 0 0, 0 10px, 10px -10px, -10px 0px;
    display: none;
  }
  .preview.show { display: block; }
  .preview img { width: 100%; display: block; }

  .btn-row { display: flex; gap: 10px; margin-top: 14px; }
  .btn {
    flex: 1;
    text-align: center;
    padding: 14px;
    border-radius: 10px;
    font-weight: 600;
    border: none;
    font-size: 15px;
    cursor: pointer;
  }
  .btn-primary { background: #111; color: #fff; }
  .btn-secondary { background: #fff; color: #111; border: 1px solid #ccc; }

  .model-tag {
    display: inline-block;
    font-size: 12px;
    background: #111;
    color: #fff;
    padding: 3px 10px;
    border-radius: 20px;
    margin-top: 6px;
  }
</style>
</head>
<body>

<div class="wrap">
  <h1>Background Remover</h1>
  <div class="sub">Cozyleaf.in — ছবি থেকে ব্যাকগ্রাউন্ড সরান, একদম ফ্রি</div>

  <label class="drop" id="dropZone">
    <div>📷 ছবি সিলেক্ট করুন</div>
    <div class="drop-btn">Choose from Gallery</div>
    <div class="hint">JPG, PNG বা WEBP</div>
    <input type="file" id="fileInput" accept="image/jpeg,image/png,image/webp" />
  </label>

  <div class="status-box status-info" id="statusInfo">
    <span id="statusText">প্রসেসিং হচ্ছে...</span>
    <div class="progress-track" id="progressTrack">
      <div class="progress-fill" id="progressFill"></div>
    </div>
  </div>

  <div class="status-box status-success" id="statusSuccess">
    ✅ Background removed successfully.
  </div>

  <div class="status-box status-error" id="statusError">
    ❌ <span id="errorText">একটা সমস্যা হয়েছে।</span>
  </div>

  <div class="preview" id="preview">
    <img id="resultImg" alt="Result" />
  </div>

  <div class="btn-row" id="btnRow" style="display:none;">
    <button class="btn btn-primary" id="downloadBtn">⬇ Download PNG</button>
    <button class="btn btn-secondary" id="retryBtn">Try another image</button>
  </div>
</div>

<script type="module">
  import removeBackground from "https://cdn.jsdelivr.net/npm/@imgly/background-removal@1.5.8/dist/browser.mjs";

  const fileInput = document.getElementById('fileInput');
  const statusInfo = document.getElementById('statusInfo');
  const statusText = document.getElementById('statusText');
  const statusSuccess = document.getElementById('statusSuccess');
  const statusError = document.getElementById('statusError');
  const errorText = document.getElementById('errorText');
  const progressTrack = document.getElementById('progressTrack');
  const progressFill = document.getElementById('progressFill');
  const preview = document.getElementById('preview');
  const resultImg = document.getElementById('resultImg');
  const btnRow = document.getElementById('btnRow');
  const downloadBtn = document.getElementById('downloadBtn');
  const retryBtn = document.getElementById('retryBtn');

  let finalBlob = null;

  // ---------------------------------------------------------
  // ধাপ ১: ডিভাইসের মেমরি ও নেটওয়ার্ক স্পিড দেখে সেরা মডেল বাছাই
  // ---------------------------------------------------------
  function detectBestModel() {
    const ram = navigator.deviceMemory || 4; // না পেলে ৪GB ধরে নেওয়া হলো
    const conn = navigator.connection || navigator.mozConnection || navigator.webkitConnection;
    const effectiveType = conn?.effectiveType || '4g';
    const saveData = conn?.saveData === true;

    const isSlowNetwork = ['slow-2g', '2g'].includes(effectiveType) || saveData;
    const isMediumNetwork = effectiveType === '3g';

    let model, label;
    if (ram <= 1 || isSlowNetwork) {
      model = 'isnet_quint8';
      label = 'ফাস্ট মোড (হালকা মডেল)';
    } else if (ram <= 3 || isMediumNetwork) {
      model = 'isnet_fp16';
      label = 'ব্যালান্সড মোড';
    } else if (ram >= 6) {
      model = 'isnet';
      label = 'হাই কোয়ালিটি মোড';
    } else {
      model = 'isnet_fp16';
      label = 'ব্যালান্সড মোড';
    }
    return { model, label, ram, effectiveType };
  }

  // ---------------------------------------------------------
  // ধাপ ২: এজ ক্লিনআপ (ghost pixel/hair-edge রেশ দূর করা)
  // ---------------------------------------------------------
  async function cleanupEdges(blob, options = {}) {
    const {
      alphaThreshold = 60,
      erodePixels = 1,
      featherRadius = 1.2,
    } = options;

    const img = await createImageBitmap(blob);
    const canvas = document.createElement('canvas');
    canvas.width = img.width;
    canvas.height = img.height;
    const ctx = canvas.getContext('2d');
    ctx.drawImage(img, 0, 0);

    const { width, height } = canvas;
    const imageData = ctx.getImageData(0, 0, width, height);
    const data = imageData.data;

    for (let i = 3; i < data.length; i += 4) {
      if (data[i] < alphaThreshold) data[i] = 0;
    }

    const alphaCopy = new Uint8ClampedArray(data.length / 4);
    for (let i = 0, j = 3; i < alphaCopy.length; i++, j += 4) {
      alphaCopy[i] = data[j];
    }

    for (let pass = 0; pass < erodePixels; pass++) {
      const before = alphaCopy.slice();
      for (let y = 1; y < height - 1; y++) {
        for (let x = 1; x < width - 1; x++) {
          const idx = y * width + x;
          if (before[idx] === 0) continue;
          const neighbors = [
            before[idx - 1], before[idx + 1],
            before[idx - width], before[idx + width],
          ];
          if (neighbors.some(a => a === 0)) {
            alphaCopy[idx] = Math.max(0, before[idx] - 180);
          }
        }
      }
    }

    const r = Math.max(1, Math.round(featherRadius));
    const feathered = alphaCopy.slice();
    for (let y = 0; y < height; y++) {
      for (let x = 0; x < width; x++) {
        const idx = y * width + x;
        if (alphaCopy[idx] === 0 || alphaCopy[idx] === 255) continue;
        let sum = 0, count = 0;
        for (let dy = -r; dy <= r; dy++) {
          for (let dx = -r; dx <= r; dx++) {
            const ny = y + dy, nx = x + dx;
            if (ny < 0 || ny >= height || nx < 0 || nx >= width) continue;
            sum += alphaCopy[ny * width + nx];
            count++;
          }
        }
        feathered[idx] = Math.round(sum / count);
      }
    }

    for (let i = 0, j = 3; i < feathered.length; i++, j += 4) {
      data[j] = feathered[i];
    }

    ctx.putImageData(imageData, 0, 0);
    return new Promise(resolve => canvas.toBlob(resolve, 'image/png'));
  }

  // ---------------------------------------------------------
  // ধাপ ৩: মূল প্রসেস — ফাইল সিলেক্ট হলে চলবে
  // ---------------------------------------------------------
  fileInput.addEventListener('change', async (e) => {
    const file = e.target.files[0];
    if (!file) return;

    // UI রিসেট
    statusSuccess.classList.remove('show');
    statusError.classList.remove('show');
    preview.classList.remove('show');
    btnRow.style.display = 'none';
    statusInfo.classList.add('show');
    progressTrack.classList.add('show');
    progressFill.style.width = '0%';

    const { model, label, ram, effectiveType } = detectBestModel();
    statusText.innerHTML = `প্রসেসিং হচ্ছে... <span class="model-tag">${label}</span>`;

    try {
      const rawBlob = await removeBackground(file, {
        model: model,
        output: { format: 'image/png', quality: 0.9 },
        progress: (key, current, total) => {
          const pct = Math.round((current / total) * 100);
          progressFill.style.width = pct + '%';
        },
      });

      statusText.textContent = 'এজ পরিষ্কার করা হচ্ছে...';
      const cleanedBlob = await cleanupEdges(rawBlob);

      finalBlob = cleanedBlob;
      resultImg.src = URL.createObjectURL(cleanedBlob);

      statusInfo.classList.remove('show');
      statusSuccess.classList.add('show');
      preview.classList.add('show');
      btnRow.style.display = 'flex';

    } catch (err) {
      console.error(err);
      statusInfo.classList.remove('show');
      statusError.classList.add('show');
      errorText.textContent = 'ছবি প্রসেস করতে সমস্যা হয়েছে। আবার চেষ্টা করুন বা অন্য ছবি ব্যবহার করুন।';
    }
  });

  downloadBtn.addEventListener('click', () => {
    if (!finalBlob) return;
    const a = document.createElement('a');
    a.href = URL.createObjectURL(finalBlob);
    a.download = 'cozyleaf-background-removed.png';
    a.click();
  });

  retryBtn.addEventListener('click', () => {
    fileInput.value = '';
    statusSuccess.classList.remove('show');
    preview.classList.remove('show');
    btnRow.style.display = 'none';
    fileInput.click();
  });
</script>

</body>
</html>
