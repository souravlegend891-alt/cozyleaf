<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Background Remover</title>
  
  <!-- Tailwind CSS CDN for styling -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- @imgly/background-removal Library -->
  <script src="https://cdn.jsdelivr.net/npm/@imgly/background-removal@1.4.5/dist/index.js"></script>
</head>
<body class="bg-slate-900 text-white min-h-screen flex flex-col items-center justify-center p-4">

  <div class="max-w-xl w-full bg-slate-800 rounded-2xl shadow-2xl p-6 border border-slate-700 text-center">
    <h1 class="text-3xl font-bold mb-2 text-indigo-400">AI Background Remover</h1>
    <p class="text-slate-400 text-sm mb-6">কোনো API Key ছাড়াই সম্পূর্ণ ফ্রিতে ব্যাকগ্রাউন্ড রিমুভ করুন</p>

    <!-- Upload Box -->
    <div id="dropZone" class="border-2 border-dashed border-slate-600 rounded-xl p-8 cursor-pointer hover:border-indigo-500 transition-colors bg-slate-800/50">
      <input type="file" id="imageInput" accept="image/*" class="hidden">
      <div class="flex flex-col items-center gap-3">
        <svg class="w-12 h-12 text-slate-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z"></path>
        </svg>
        <span class="text-slate-300 font-medium">ছবি সিলেক্ট করতে এখানে ক্লিক করুন</span>
        <span class="text-xs text-slate-500">PNG, JPG, WEBP সাপোর্ট করে</span>
      </div>
    </div>

    <!-- Loading Indicator -->
    <div id="loader" class="hidden my-8">
      <div class="inline-block animate-spin rounded-full h-10 w-10 border-4 border-indigo-500 border-t-transparent"></div>
      <p class="mt-3 text-slate-300 font-medium">প্রসেসিং চলছে... প্রথমবার ১-২ সেকেন্ড সময় লাগতে পারে</p>
    </div>

    <!-- Result Display -->
    <div id="resultContainer" class="hidden mt-6">
      <h2 class="text-lg font-semibold text-slate-300 mb-3">ফলাফল:</h2>
      <div class="bg-slate-950/50 p-4 rounded-xl border border-slate-700 flex justify-center mb-4">
        <!-- Transparent Pattern Preview -->
        <img id="outputImage" class="max-h-80 rounded-lg object-contain bg-[radial-gradient(#334155_1px,transparent_1px)] [background-size:16px_16px]" alt="Processed Image">
      </div>
      
      <a id="downloadBtn" download="background-removed.png" class="inline-flex items-center gap-2 bg-indigo-600 hover:bg-indigo-500 text-white font-medium py-2.5 px-6 rounded-lg transition-all shadow-lg">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"></path>
        </svg>
        ডাউনলোড করুন (PNG)
      </a>
    </div>

    <!-- Error Alert -->
    <div id="errorAlert" class="hidden mt-4 p-3 bg-red-900/50 border border-red-500 text-red-200 text-sm rounded-lg"></div>
  </div>

  <script>
    const dropZone = document.getElementById('dropZone');
    const imageInput = document.getElementById('imageInput');
    const loader = document.getElementById('loader');
    const resultContainer = document.getElementById('resultContainer');
    const outputImage = document.getElementById('outputImage');
    const downloadBtn = document.getElementById('downloadBtn');
    const errorAlert = document.getElementById('errorAlert');

    dropZone.addEventListener('click', () => imageInput.click());

    imageInput.addEventListener('change', async (e) => {
      const file = e.target.files[0];
      if (!file) return;

      // Reset and show loader
      errorAlert.classList.add('hidden');
      resultContainer.classList.add('hidden');
      loader.classList.remove('hidden');

      try {
        // Run AI background removal directly in browser
        const blob = await imglyRemoveBackground(file);
        const url = URL.createObjectURL(blob);

        outputImage.src = url;
        downloadBtn.href = url;

        loader.classList.add('hidden');
        resultContainer.classList.remove('hidden');
      } catch (err) {
        console.error(err);
        loader.classList.add('hidden');
        errorAlert.textContent = 'ছবি প্রসেস করতে সমস্যা হয়েছে। অনুগ্রহ করে অন্য কোনো পরিষ্কার ছবি দিয়ে চেষ্টা করুন।';
        errorAlert.classList.remove('hidden');
      }
    });
  </script>

</body>
</html>
