<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ব্যাকগ্রাউন্ড রিমুভার টুল - Background Remover</title>
  
  <!-- Styling -->
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background-color: #0f172a;
      color: #f8fafc;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    .container {
      background-color: #1e293b;
      padding: 30px;
      border-radius: 16px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
      width: 100%;
      max-width: 800px;
      text-align: center;
    }

    h1 {
      margin-bottom: 10px;
      color: #38bdf8;
    }

    p.subtitle {
      color: #94a3b8;
      margin-bottom: 25px;
    }

    .upload-area {
      border: 2px dashed #38bdf8;
      border-radius: 12px;
      padding: 40px 20px;
      cursor: pointer;
      background-color: #0f172a;
      transition: all 0.3s ease;
      margin-bottom: 20px;
    }

    .upload-area:hover {
      background-color: #1e293b;
      border-color: #60a5fa;
    }

    .upload-area input {
      display: none;
    }

    .upload-btn {
      display: inline-block;
      padding: 10px 20px;
      background-color: #38bdf8;
      color: #0f172a;
      font-weight: bold;
      border-radius: 8px;
      margin-top: 10px;
      cursor: pointer;
    }

    .loading {
      display: none;
      margin: 20px 0;
      font-weight: bold;
      color: #f59e0b;
    }

    .preview-container {
      display: flex;
      flex-wrap: wrap;
      gap: 20px;
      justify-content: center;
      margin-top: 25px;
    }

    .image-box {
      flex: 1;
      min-width: 250px;
      background: #0f172a;
      padding: 15px;
      border-radius: 10px;
    }

    .image-box h3 {
      margin-bottom: 10px;
      font-size: 16px;
      color: #cbd5e1;
    }

    .image-box img {
      max-width: 100%;
      height: auto;
      border-radius: 8px;
      /* Background grid pattern for PNG transparency */
      background-image: linear-gradient(45deg, #334155 25%, transparent 25%), 
                        linear-gradient(-45deg, #334155 25%, transparent 25%), 
                        linear-gradient(45deg, transparent 75%, #334155 75%), 
                        linear-gradient(-45deg, transparent 75%, #334155 75%);
      background-size: 20px 20px;
      background-position: 0 0, 0 10px, 10px -10px, -10px 0px;
    }

    .download-btn {
      display: none;
      margin: 20px auto 0;
      padding: 12px 25px;
      background-color: #22c55e;
      color: white;
      text-decoration: none;
      font-weight: bold;
      border-radius: 8px;
      width: fit-content;
      transition: background 0.2s ease;
    }

    .download-btn:hover {
      background-color: #16a34a;
    }
  </style>

  <!-- imgly Background Removal Library Script -->
  <script src="https://cdn.jsdelivr.net/npm/@imgly/background-removal@1.4.5/dist/index.umd.js"></script>
</head>
<body>

  <div class="container">
    <h1>AI Background Remover</h1>
    <p class="subtitle">আপনার ছবির ব্যাকগ্রাউন্ড মুহূর্তেই রিমুভ করুন সম্পূর্ণ বিনামূল্যে</p>

    <!-- Upload Input Area -->
    <div class="upload-area" id="dropArea" onclick="document.getElementById('imageInput').click()">
      <p>এখানে ছবি ড্রাগ করে ছাড়ুন অথবা ক্লিক করে ছবি সিলেক্ট করুন</p>
      <span class="upload-btn">ছবি আপলোড করুন</span>
      <input type="file" id="imageInput" accept="image/*">
    </div>

    <!-- Processing Loader -->
    <div class="loading" id="loader">
      ⏳ ছবি প্রসেস করা হচ্ছে, দয়া করে কিছু সময় অপেক্ষা করুন...
    </div>

    <!-- Image Preview Section -->
    <div class="preview-container" id="previewContainer" style="display: none;">
      <div class="image-box">
        <h3>মূল ছবি</h3>
        <img id="originalImg" src="" alt="Original Image">
      </div>
      <div class="image-box">
        <h3>ব্যাকগ্রাউন্ড রিমুভড ছবি</h3>
        <img id="resultImg" src="" alt="Result Image">
      </div>
    </div>

    <!-- Download Link -->
    <a href="#" id="downloadBtn" class="download-btn" download="background-removed.png">ছবি ডাউনলোড করুন</a>
  </div>

  <script>
    const imageInput = document.getElementById('imageInput');
    const loader = document.getElementById('loader');
    const previewContainer = document.getElementById('previewContainer');
    const originalImg = document.getElementById('originalImg');
    const resultImg = document.getElementById('resultImg');
    const downloadBtn = document.getElementById('downloadBtn');

    imageInput.addEventListener('change', async (event) => {
      const file = event.target.files[0];
      if (!file) return;

      // Show original image preview
      originalImg.src = URL.createObjectURL(file);
      
      // UI Update
      loader.style.display = 'block';
      previewContainer.style.display = 'none';
      downloadBtn.style.display = 'none';

      try {
        // Run AI Background Removal
        const blob = await imglyRemoveBackground(file);
        const url = URL.createObjectURL(blob);

        // Show result image
        resultImg.src = url;
        downloadBtn.href = url;

        // UI Update
        loader.style.display = 'none';
        previewContainer.style.display = 'flex';
        downloadBtn.style.display = 'inline-block';

      } catch (error) {
        console.error("Error removing background:", error);
        alert("ছবিটির ব্যাকগ্রাউন্ড রিমুভ করতে সমস্যা হয়েছে। অন্য কোনো ছবি দিয়ে চেষ্টা করুন।");
        loader.style.display = 'none';
      }
    });
  </script>

</body>
</html>
