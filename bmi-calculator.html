<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>BMI Calculator - Cozyleaf</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet"/>
<style>
  *{margin:0;padding:0;box-sizing:border-box;}
  body{background:#F5F4F0;font-family:'Inter',sans-serif;color:#14161A;}
  .top-back{display:block;max-width:480px;margin:20px auto 0;padding:0 22px;font-size:13.5px;font-weight:600;color:#6B6F76;text-decoration:none;}
  .bmi-wrap{
    max-width:480px;margin:12px auto 40px;font-family:'Inter',sans-serif;
    background:#F5F4F0;border:1px solid #E6E4DD;border-radius:14px;
    padding:26px 22px;color:#14161A;
  }
  .bmi-wrap h2{font-family:'Space Grotesk',sans-serif;font-size:22px;margin-bottom:6px;}
  .bmi-wrap p.sub{color:#6B6F76;font-size:14px;margin-bottom:20px;}
  .bmi-unit-toggle{display:flex;gap:8px;margin-bottom:18px;}
  .bmi-unit-toggle button{
    flex:1;padding:10px;border-radius:10px;border:1px solid #E6E4DD;
    background:#fff;font-weight:600;font-size:14px;color:#6B6F76;transition:.15s;cursor:pointer;
  }
  .bmi-unit-toggle button.active{background:#2EC4B6;color:#fff;border-color:#2EC4B6;}
  .bmi-field{margin-bottom:16px;}
  .bmi-field label{display:block;font-size:13.5px;font-weight:600;margin-bottom:6px;color:#14161A;}
  .bmi-field input{
    width:100%;padding:12px 14px;border-radius:10px;border:1px solid #E6E4DD;
    font-size:15px;outline:none;background:#fff;
  }
  .bmi-field input:focus{border-color:#2EC4B6;}
  .bmi-row{display:flex;gap:10px;}
  .bmi-row .bmi-field{flex:1;}
  .bmi-btn{
    width:100%;padding:13px;border:none;border-radius:10px;
    background:#FF6B4A;color:#fff;font-weight:700;font-size:15px;margin-top:6px;cursor:pointer;
  }
  .bmi-btn:hover{background:#E85436;}
  .bmi-result{
    margin-top:22px;padding:18px;border-radius:12px;background:#fff;
    border:1px solid #E6E4DD;text-align:center;display:none;
  }
  .bmi-result.show{display:block;}
  .bmi-result .num{font-family:'Space Grotesk',sans-serif;font-size:38px;font-weight:700;}
  .bmi-result .cat{font-size:14px;font-weight:600;margin-top:4px;padding:4px 10px;border-radius:20px;display:inline-block;}
  .bmi-result .desc{font-size:13px;color:#6B6F76;margin-top:10px;}
  .cat-under{background:#FFF3E0;color:#F4A527;}
  .cat-normal{background:#E4F9F6;color:#159C8F;}
  .cat-over{background:#FFEDE8;color:#E85436;}
  .cat-obese{background:#FBE9E9;color:#C0392B;}
</style>
</head>
<body>

<a class="top-back" href="index.html">← Back to all tools</a>

<div class="bmi-wrap">
  <h2>BMI Calculator</h2>
  <p class="sub">Check your Body Mass Index by entering your height and weight below.</p>

  <div class="bmi-unit-toggle">
    <button id="unitMetric" class="active">Metric (kg/cm)</button>
    <button id="unitImperial">Imperial (lb/in)</button>
  </div>

  <div id="metricFields">
    <div class="bmi-row">
      <div class="bmi-field">
        <label>Height (cm)</label>
        <input type="number" id="heightCm" placeholder="e.g. 170"/>
      </div>
      <div class="bmi-field">
        <label>Weight (kg)</label>
        <input type="number" id="weightKg" placeholder="e.g. 65"/>
      </div>
    </div>
  </div>

  <div id="imperialFields" style="display:none;">
    <div class="bmi-row">
      <div class="bmi-field">
        <label>Height (in)</label>
        <input type="number" id="heightIn" placeholder="e.g. 67"/>
      </div>
      <div class="bmi-field">
        <label>Weight (lb)</label>
        <input type="number" id="weightLb" placeholder="e.g. 143"/>
      </div>
    </div>
  </div>

  <button class="bmi-btn" id="calcBtn">Calculate BMI</button>

  <div class="bmi-result" id="bmiResult">
    <div class="num" id="bmiNum">--</div>
    <div class="cat" id="bmiCat">--</div>
    <div class="desc" id="bmiDesc"></div>
  </div>
</div>

<script>
(function(){
  var metricBtn = document.getElementById('unitMetric');
  var imperialBtn = document.getElementById('unitImperial');
  var metricFields = document.getElementById('metricFields');
  var imperialFields = document.getElementById('imperialFields');
  var isMetric = true;

  metricBtn.addEventListener('click', function(){
    isMetric = true;
    metricBtn.classList.add('active');
    imperialBtn.classList.remove('active');
    metricFields.style.display = 'block';
    imperialFields.style.display = 'none';
  });

  imperialBtn.addEventListener('click', function(){
    isMetric = false;
    imperialBtn.classList.add('active');
    metricBtn.classList.remove('active');
    imperialFields.style.display = 'block';
    metricFields.style.display = 'none';
  });

  document.getElementById('calcBtn').addEventListener('click', function(){
    var bmi;

    if(isMetric){
      var h = parseFloat(document.getElementById('heightCm').value);
      var w = parseFloat(document.getElementById('weightKg').value);
      if(!h || !w || h <= 0 || w <= 0){
        alert('Please enter valid height and weight.');
        return;
      }
      var hM = h / 100;
      bmi = w / (hM * hM);
    } else {
      var hIn = parseFloat(document.getElementById('heightIn').value);
      var wLb = parseFloat(document.getElementById('weightLb').value);
      if(!hIn || !wLb || hIn <= 0 || wLb <= 0){
        alert('Please enter valid height and weight.');
        return;
      }
      bmi = (wLb / (hIn * hIn)) * 703;
    }

    bmi = Math.round(bmi * 10) / 10;

    var cat, catClass, desc;
    if(bmi < 18.5){
      cat = 'Underweight'; catClass = 'cat-under';
      desc = 'Your BMI suggests you may be underweight. Consider consulting a healthcare provider.';
    } else if(bmi < 25){
      cat = 'Normal weight'; catClass = 'cat-normal';
      desc = 'Your BMI is within the healthy weight range.';
    } else if(bmi < 30){
      cat = 'Overweight'; catClass = 'cat-over';
      desc = 'Your BMI suggests you may be overweight. A balanced diet and exercise can help.';
    } else {
      cat = 'Obese'; catClass = 'cat-obese';
      desc = 'Your BMI falls in the obese range. Consider speaking with a healthcare provider.';
    }

    document.getElementById('bmiNum').textContent = bmi;
    var catEl = document.getElementById('bmiCat');
    catEl.textContent = cat;
    catEl.className = 'cat ' + catClass;
    document.getElementById('bmiDesc').textContent = desc;
    document.getElementById('bmiResult').classList.add('show');
  });
})();
</script>
</body>
</html>
