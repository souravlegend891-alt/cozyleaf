<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Calorie Calculator - Cozyleaf</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet"/>
<style>
  *{margin:0;padding:0;box-sizing:border-box;}
  body{background:#F5F4F0;font-family:'Inter',sans-serif;color:#14161A;}
  .top-back{display:block;max-width:480px;margin:20px auto 0;padding:0 22px;font-size:13.5px;font-weight:600;color:#6B6F76;text-decoration:none;}
  .cal-wrap{
    max-width:480px;margin:12px auto 40px;
    background:#F5F4F0;border:1px solid #E6E4DD;border-radius:14px;
    padding:26px 22px;color:#14161A;
  }
  .cal-wrap h2{font-family:'Space Grotesk',sans-serif;font-size:22px;margin-bottom:6px;}
  .cal-wrap p.sub{color:#6B6F76;font-size:14px;margin-bottom:20px;}
  .cal-unit-toggle{display:flex;gap:8px;margin-bottom:18px;}
  .cal-unit-toggle button{
    flex:1;padding:10px;border-radius:10px;border:1px solid #E6E4DD;
    background:#fff;font-weight:600;font-size:14px;color:#6B6F76;transition:.15s;cursor:pointer;
  }
  .cal-unit-toggle button.active{background:#2EC4B6;color:#fff;border-color:#2EC4B6;}
  .cal-field{margin-bottom:16px;}
  .cal-field label{display:block;font-size:13.5px;font-weight:600;margin-bottom:6px;color:#14161A;}
  .cal-field input, .cal-field select{
    width:100%;padding:12px 14px;border-radius:10px;border:1px solid #E6E4DD;
    font-size:15px;outline:none;background:#fff;font-family:'Inter',sans-serif;
  }
  .cal-field input:focus, .cal-field select:focus{border-color:#2EC4B6;}
  .cal-row{display:flex;gap:10px;}
  .cal-row .cal-field{flex:1;}
  .cal-btn{
    width:100%;padding:13px;border:none;border-radius:10px;
    background:#FF6B4A;color:#fff;font-weight:700;font-size:15px;margin-top:6px;cursor:pointer;
  }
  .cal-btn:hover{background:#E85436;}
  .cal-result{
    margin-top:22px;padding:18px;border-radius:12px;background:#fff;
    border:1px solid #E6E4DD;text-align:center;display:none;
  }
  .cal-result.show{display:block;}
  .cal-result .num{font-family:'Space Grotesk',sans-serif;font-size:34px;font-weight:700;}
  .cal-result .label{font-size:13px;color:#6B6F76;margin-top:2px;}
  .cal-breakdown{margin-top:16px;text-align:left;border-top:1px solid #E6E4DD;padding-top:14px;}
  .cal-breakdown-row{display:flex;justify-content:space-between;font-size:13.5px;padding:6px 0;color:#14161A;}
  .cal-breakdown-row span:last-child{font-weight:600;}
</style>
</head>
<body>

<a class="top-back" href="index.html">← Back to all tools</a>

<div class="cal-wrap">
  <h2>Calorie Calculator</h2>
  <p class="sub">Estimate your daily calorie needs based on your body and activity level.</p>

  <div class="cal-unit-toggle">
    <button id="unitMetric" class="active">Metric (kg/cm)</button>
    <button id="unitImperial">Imperial (lb/in)</button>
  </div>

  <div class="cal-row">
    <div class="cal-field">
      <label>Age</label>
      <input type="number" id="age" placeholder="e.g. 28"/>
    </div>
    <div class="cal-field">
      <label>Gender</label>
      <select id="gender">
        <option value="male">Male</option>
        <option value="female">Female</option>
      </select>
    </div>
  </div>

  <div id="metricFields">
    <div class="cal-row">
      <div class="cal-field">
        <label>Height (cm)</label>
        <input type="number" id="heightCm" placeholder="e.g. 170"/>
      </div>
      <div class="cal-field">
        <label>Weight (kg)</label>
        <input type="number" id="weightKg" placeholder="e.g. 65"/>
      </div>
    </div>
  </div>

  <div id="imperialFields" style="display:none;">
    <div class="cal-row">
      <div class="cal-field">
        <label>Height (in)</label>
        <input type="number" id="heightIn" placeholder="e.g. 67"/>
      </div>
      <div class="cal-field">
        <label>Weight (lb)</label>
        <input type="number" id="weightLb" placeholder="e.g. 143"/>
      </div>
    </div>
  </div>

  <div class="cal-field">
    <label>Activity Level</label>
    <select id="activity">
      <option value="1.2">Sedentary (little or no exercise)</option>
      <option value="1.375">Lightly active (1-3 days/week)</option>
      <option value="1.55" selected>Moderately active (3-5 days/week)</option>
      <option value="1.725">Very active (6-7 days/week)</option>
      <option value="1.9">Extra active (hard exercise daily)</option>
    </select>
  </div>

  <button class="cal-btn" id="calcBtn">Calculate Calories</button>

  <div class="cal-result" id="calResult">
    <div class="num" id="calNum">--</div>
    <div class="label">Calories per day to maintain weight</div>
    <div class="cal-breakdown">
      <div class="cal-breakdown-row"><span>Lose weight (0.5 kg/week)</span><span id="calLose">--</span></div>
      <div class="cal-breakdown-row"><span>Maintain weight</span><span id="calMaintain">--</span></div>
      <div class="cal-breakdown-row"><span>Gain weight (0.5 kg/week)</span><span id="calGain">--</span></div>
    </div>
  </div>
</div>

<script>
(function(){
  var metricBtn = document.getElementById('unitMetric');
  var imperialBtn = document.getElementById('unitImperial');
  var metricFields = document.getElementById('metricFields');
  var imperialFields = document.getElementById('imperialFields');
  var isMetric = true;

  metricBtn.addEventListener('click', function(){
    isMetric = true;
    metricBtn.classList.add('active');
    imperialBtn.classList.remove('active');
    metricFields.style.display = 'block';
    imperialFields.style.display = 'none';
  });

  imperialBtn.addEventListener('click', function(){
    isMetric = false;
    imperialBtn.classList.add('active');
    metricBtn.classList.remove('active');
    imperialFields.style.display = 'block';
    metricFields.style.display = 'none';
  });

  document.getElementById('calcBtn').addEventListener('click', function(){
    var age = parseFloat(document.getElementById('age').value);
    var gender = document.getElementById('gender').value;
    var activity = parseFloat(document.getElementById('activity').value);
    var heightCm, weightKg;

    if(isMetric){
      heightCm = parseFloat(document.getElementById('heightCm').value);
      weightKg = parseFloat(document.getElementById('weightKg').value);
    } else {
      var heightIn = parseFloat(document.getElementById('heightIn').value);
      var weightLb = parseFloat(document.getElementById('weightLb').value);
      heightCm = heightIn * 2.54;
      weightKg = weightLb * 0.453592;
    }

    if(!age || age <= 0 || !heightCm || heightCm <= 0 || !weightKg || weightKg <= 0){
      alert('Please enter valid age, height, and weight.');
      return;
    }

    var bmr;
    if(gender === 'male'){
      bmr = (10 * weightKg) + (6.25 * heightCm) - (5 * age) + 5;
    } else {
      bmr = (10 * weightKg) + (6.25 * heightCm) - (5 * age) - 161;
    }

    var maintain = Math.round(bmr * activity);
    var lose = maintain - 500;
    var gain = maintain + 500;

    document.getElementById('calNum').textContent = maintain;
    document.getElementById('calMaintain').textContent = maintain + ' kcal';
    document.getElementById('calLose').textContent = lose + ' kcal';
    document.getElementById('calGain').textContent = gain + ' kcal';
    document.getElementById('calResult').classList.add('show');
  });
})();
</script>
</body>
</html>
